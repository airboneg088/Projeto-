<title>Éde Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: portais por loja — escolha da loja, quem está usando, e então quadro (gerência) ou lista de tarefas (funcionário). Topo laranja da marca, navegação no polegar. */
:root {
  --bg: #fff4e8; --surface: #ffffff; --surface-2: #f3e6d6; --surface-3: #ead8c4; --line: #e3cfba;
  --ink: #2a1810; --ink-soft: #6b5a50; --brand: #ee5d06; --action: #c2470a; --action-ink: #ffffff;
  --focus: #2a1810; --danger: #a8291f; --danger-bg: #fbe4e1; --ok: #1b5b2e; --ok-bg: #dfefe1;
  --s-pend-bg: #f7f0e8; --s-pend-fg: #4a3a30; --s-pend-bd: #b9a797;
  --s-and-bg: #e1ebf5; --s-and-fg: #1c4a78;
  --s-agu-bg: #fbedc4; --s-agu-fg: #664500;
  --s-apr-bg: #dfefe1; --s-apr-fg: #1b5b2e;
  --s-cor-bg: #e6c3e0; --s-cor-fg: #5a1f56;
  --s-atr-bg: #b3261e; --s-atr-fg: #ffffff;
  --s-can-bg: #f1ece7; --s-can-fg: #5c514a; --s-can-bd: #a39486;
  --font-display: "Bitter", Rockwell, Georgia, serif;
  --font-text: "Figtree", Arial, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --r-s: 8px; --r-m: 14px; --r-pill: 999px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a100b; --surface: #26180f; --surface-2: #33231a; --surface-3: #3f2c21; --line: #4a3428; --ink: #fff4e8; --ink-soft: #d2bfb0;
  --brand: #ee5d06; --action: #f07a3c; --action-ink: #1a0d06; --focus: #ffc9a6; --danger: #ff8f84; --danger-bg: #3b1714; --ok: #8fd4a8; --ok-bg: #163421;
  --s-pend-bg: #2b2019; --s-pend-fg: #ede1d6; --s-pend-bd: #6e5d51; --s-and-bg: #1b2d42; --s-and-fg: #bbd6f2;
  --s-agu-bg: #3b2d0c; --s-agu-fg: #f4d58e; --s-apr-bg: #163421; --s-apr-fg: #abddb6; --s-cor-bg: #5e2d59; --s-cor-fg: #fbe3f7;
  --s-atr-bg: #f2877d; --s-atr-fg: #2b0b07; --s-can-bg: #2a221d; --s-can-fg: #bfb2a7; --s-can-bd: #6e6158; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1a100b; --surface: #26180f; --surface-2: #33231a; --surface-3: #3f2c21; --line: #4a3428; --ink: #fff4e8; --ink-soft: #d2bfb0;
  --brand: #ee5d06; --action: #f07a3c; --action-ink: #1a0d06; --focus: #ffc9a6; --danger: #ff8f84; --danger-bg: #3b1714; --ok: #8fd4a8; --ok-bg: #163421;
  --s-pend-bg: #2b2019; --s-pend-fg: #ede1d6; --s-pend-bd: #6e5d51; --s-and-bg: #1b2d42; --s-and-fg: #bbd6f2;
  --s-agu-bg: #3b2d0c; --s-agu-fg: #f4d58e; --s-apr-bg: #163421; --s-apr-fg: #abddb6; --s-cor-bg: #5e2d59; --s-cor-fg: #fbe3f7;
  --s-atr-bg: #f2877d; --s-atr-fg: #2b0b07; --s-can-bg: #2a221d; --s-can-fg: #bfb2a7; --s-can-bd: #6e6158; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
select { max-width: 100%; min-width: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.15; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 700; line-height: 1.3; }
p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.estreito { max-width: 760px; }
.soft { color: var(--ink-soft); }
.small { font-size: 14px; }
.linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.entre { justify-content: space-between; }
.pilha { display: grid; gap: 12px; }

/* Topo */
.top { background: var(--brand); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 58px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff; white-space: nowrap; flex: none; background: none; border: 0; padding: 0; cursor: pointer; min-height: 44px; }
.marca img { width: 32px; height: 32px; border-radius: 8px; display: block; box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
.marca .loja { font-family: var(--font-text); font-weight: 700; font-size: 15px; opacity: .95; }
.chip-top { margin-left: auto; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: var(--r-pill); padding: 4px 4px 4px 14px; min-height: 44px; cursor: pointer; min-width: 0; font-weight: 700; }
.chip-top span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.av { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--action); display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
.av.g { background: #2a1810; color: #fff; }
@media (max-width: 400px) { .marca .nome { display: none; } }

/* Navegação inferior (gerência) */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav button { position: relative; border: 0; background: none; min-height: var(--nav-h); display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--ink-soft); cursor: pointer; transition: transform 140ms var(--ease-out); }
.nav button:active { transform: scale(0.96); }
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--action); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--action); }
.nav .n { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--s-atr-bg); color: var(--s-atr-fg); font-size: 12px; line-height: 20px; }
main .wrap { padding-block: 18px 40px; display: grid; gap: 18px; }
main.com-nav .wrap { padding-bottom: calc(var(--nav-h) + 48px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .nav { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; }
  .nav .wrap { grid-auto-columns: max-content; justify-content: start; gap: 6px; }
  .nav button { grid-auto-flow: column; gap: 8px; min-height: 52px; padding: 0 14px; font-size: 15px; }
  .nav button svg { width: 22px; height: 22px; }
  .nav button[aria-current="page"]::before { top: auto; bottom: 0; left: 10px; right: 10px; border-radius: 3px 3px 0 0; }
  .nav .n { position: static; }
  main.com-nav .wrap { padding-bottom: 64px; }
}

/* Botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: var(--r-m); border: 1px solid transparent; font-weight: 800; font-size: 17px; cursor: pointer; transition: transform 160ms var(--ease-out); text-decoration: none; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--action); color: var(--action-ink); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn.ghost { background: none; color: var(--ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 22px; height: 22px; flex: none; }
@media (hover: hover) and (pointer: fine) { .btn.primary:hover { filter: brightness(1.07); } .btn.secondary:hover, .lt:hover, .portal:hover, .pessoa:hover { background: var(--surface-2); } }
@media (prefers-reduced-motion: reduce) { .btn, .nav button, .op, .kcard { transition: none !important; } .btn:active, .nav button:active { transform: none; } }
label.f { display: grid; gap: 6px; font-weight: 700; }
input[type="text"], input[type="time"], input[type="date"], input[type="number"], input[type="password"], select.f, textarea { background: var(--surface); border: 1px solid var(--s-pend-bd); border-radius: var(--r-s); padding: 12px; min-height: 52px; width: 100%; }
textarea { min-height: 92px; resize: vertical; }
.chk { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; }
.chk input { width: 24px; height: 24px; accent-color: var(--action); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; cursor: pointer; }
.chip[aria-pressed="true"], .chip:has(input:checked) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 18px; min-height: 48px; font-weight: 800; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; display: grid; gap: 16px; }
.erro { color: var(--danger); font-weight: 700; }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; display: grid; gap: 10px; }

/* Status */
.st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.st svg { flex: none; width: 15px; height: 15px; }
.st.pendente { background: var(--s-pend-bg); color: var(--s-pend-fg); border-color: var(--s-pend-bd); }
.st.andamento { background: var(--s-and-bg); color: var(--s-and-fg); }
.st.enviada { background: var(--s-agu-bg); color: var(--s-agu-fg); }
.st.aprovada { background: var(--s-apr-bg); color: var(--s-apr-fg); }
.st.correcao { background: var(--s-cor-bg); color: var(--s-cor-fg); }
.st.atrasada { background: var(--s-atr-bg); color: var(--s-atr-fg); }
.st.cancelada { background: var(--s-can-bg); color: var(--s-can-fg); border-color: var(--s-can-bd); border-style: dashed; }

/* Portais */
.portais { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.portal { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px; display: grid; gap: 12px; cursor: pointer; min-height: 170px; align-content: start; }
.portal .pt { display: flex; align-items: center; gap: 12px; }
.portal .pi { width: 48px; height: 48px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; flex: none; }
.portal .pi img { width: 30px; height: 30px; }
.portal h2 { font-size: 24px; }
.portal .nums { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.portal .nums span { display: grid; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.portal .nums b { font-family: var(--font-display); font-weight: 900; font-size: 26px; color: var(--ink); line-height: 1.1; }
.portal .nums .ruim b { color: var(--danger); }
.portal .entrar { color: var(--action); font-weight: 800; display: flex; align-items: center; gap: 6px; }
@media (max-width: 760px) { .portais { grid-template-columns: minmax(0,1fr); } .portal { min-height: 0; } }

/* Quem está usando */
.pessoas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pessoa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px 12px; display: grid; justify-items: center; gap: 8px; text-align: center; cursor: pointer; min-height: 150px; align-content: center; }
.pessoa .av { width: 56px; height: 56px; font-size: 20px; background: var(--surface-2); color: var(--ink); }
.pessoa.g .av { background: var(--ink); color: var(--bg); }
.pessoa b { font-size: 17px; }
.pessoa span { font-size: 13px; color: var(--ink-soft); }
.pessoa .cnt { font-weight: 800; color: var(--action); }

/* Lista do funcionário */
.lt { width: 100%; display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; cursor: pointer; min-height: 72px; }
.lt .h { font-weight: 800; font-size: 17px; line-height: 1.1; }
.lt .h small { display: block; font-weight: 600; font-size: 12px; color: var(--ink-soft); }
.lt .tt { font-weight: 800; font-size: 17px; display: block; }
.lt .m { display: block; font-size: 14px; color: var(--ink-soft); }
.lt.feita { opacity: .75; }
.lt.foco { border: 2px solid var(--action); }
.lt.foco.atr { border-color: var(--s-atr-bg); }
.vazio { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 26px 20px; display: grid; gap: 10px; text-align: center; justify-items: center; }
.vazio .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; }
.vazio p { color: var(--ink-soft); max-width: 46ch; }
.progresso { display: grid; gap: 8px; }
.barra-p { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.barra-p i { display: block; height: 100%; background: var(--ok); border-radius: 5px; transition: width 300ms var(--ease-out); }

/* Quadro (kanban) */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x proximity; overscroll-behavior-x: contain; align-items: flex-start; }
.col { flex: 0 0 min(290px, 84vw); scroll-snap-align: start; background: var(--surface-2); border-radius: var(--r-m); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 260px; border: 2px solid transparent; transition: border-color 120ms var(--ease-out), background-color 120ms var(--ease-out); }
.col.alvo { border-color: var(--action); background: var(--surface-3); }
.col .ch { display: flex; align-items: center; gap: 10px; padding: 4px 4px 6px; }
.col .ch .av { width: 34px; height: 34px; font-size: 14px; background: var(--surface); color: var(--ink); }
.col .ch.livre .av { background: var(--brand); color: #fff; }
.col .ch b { display: block; line-height: 1.2; }
.col .ch span { font-size: 13px; color: var(--ink-soft); }
.col .drop-vazio { border: 2px dashed var(--line); border-radius: var(--r-m); padding: 18px 12px; text-align: center; color: var(--ink-soft); font-size: 14px; font-weight: 600; }
@media (min-width: 1100px) { .col { flex: 1 0 230px; } }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; display: grid; gap: 6px; cursor: grab; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; text-align: left; width: 100%; }
.kcard .kt { font-weight: 800; font-size: 16px; line-height: 1.25; }
.kcard .st { justify-self: start; }
.kcard .km { font-size: 13px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.kcard.lock { cursor: pointer; }
.kcard.feita { opacity: .7; }
.kcard.arrastando { opacity: .35; }
.fantasma { position: fixed; z-index: 50; pointer-events: none; box-shadow: 0 16px 40px rgba(26,16,11,.35); transform: rotate(2deg) scale(1.02); }
.irpara { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.irpara .chip { white-space: nowrap; flex: none; }
@media (min-width: 1100px) { .irpara { display: none; } }
.dica { background: var(--s-agu-bg); color: var(--s-agu-fg); border-radius: var(--r-s); padding: 10px 12px; font-weight: 700; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.dica svg { flex: none; }

/* Folha (tarefa) */
#sheet, #modal { position: fixed; inset: 0; z-index: 30; }
#sheet[hidden], #modal[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(26,16,11,.55); }
.folha { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.folha .cab { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 2; padding-top: env(safe-area-inset-top, 0px); }
.folha .cab .wrap { display: flex; align-items: center; gap: 8px; min-height: 60px; }
.folha .cab h2 { font-size: 19px; flex: 1; min-width: 0; }
.voltar { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.folha .corpo { padding-block: 16px calc(150px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 900px) { .folha { left: 50%; transform: translateX(-50%); width: min(760px, 100%); box-shadow: 0 0 0 1px var(--line), 0 24px 64px rgba(26,16,11,.35); } }
.info { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 10px; }
.info .q { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--ink-soft); }
.info .q b { color: var(--ink); }
.aviso-cor { background: var(--s-cor-bg); color: var(--s-cor-fg); border-radius: var(--r-s); padding: 10px 12px; font-weight: 700; font-size: 15px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 12px; scroll-margin-top: 80px; }
.item.falta { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-bg); }
.item .tx { font-weight: 700; font-size: 17px; }
.item .tx .n { color: var(--ink-soft); font-weight: 800; margin-right: 6px; }
.ops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.op { min-height: 52px; border-radius: var(--r-m); border: 2px solid var(--line); background: var(--surface); font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform 140ms var(--ease-out); }
.op:active { transform: scale(0.97); }
.op svg { width: 22px; height: 22px; }
.op.feito[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.op.prob[aria-pressed="true"] { background: var(--s-cor-bg); border-color: var(--s-cor-fg); color: var(--s-cor-fg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-soft); }
.tag.crit { background: var(--s-atr-bg); color: var(--s-atr-fg); }
.tag.obr { background: var(--danger-bg); color: var(--danger); }
.prova { background: var(--surface); border: 2px solid var(--action); border-radius: var(--r-m); padding: 16px; display: grid; gap: 12px; scroll-margin-top: 80px; }
.prova.falta { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-bg); }
.prova .bts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cap { position: relative; display: grid; justify-items: center; gap: 6px; min-height: 96px; align-content: center; border-radius: var(--r-m); background: var(--action); color: var(--action-ink); font-weight: 800; cursor: pointer; text-align: center; padding: 10px; }
.cap.sec { background: var(--surface-2); color: var(--ink); }
.cap svg { width: 30px; height: 30px; }
.cap input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.midias { display: flex; flex-wrap: wrap; gap: 10px; }
.mid { position: relative; width: 104px; height: 104px; border-radius: var(--r-s); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); padding: 0; cursor: zoom-in; }

// --- Painel ------------------------------------------------------------------
function tarefasPeriodo(lojas) {
  const per = S.painel.periodo; const ini = per === "1" ? hoje() : per === "7" ? somaDias(hoje(), -6) : mesAtual() + "-01";
  const fonteD = per === "mes" && S.painel.extra ? S.painel.extra : S.diarias;
  const out = [];
  for (const [id, d] of Object.entries(fonteD)) if (lojas.includes(d.loja) && d.data >= ini && d.data <= hoje()) out.push(...Object.entries(d.tarefas || {}).map(([tid, t]) => ({ ...t, id: tid, doc: id, loja: d.loja, tipo: "diaria" })));
  for (const [id, d] of Object.entries(S.mensais)) if (lojas.includes(d.loja) && d.mes === mesAtual()) out.push(...Object.entries(d.tarefas || {}).map(([tid, t]) => ({ ...t, id: tid, doc: id, loja: d.loja, tipo: "mensal" })).filter((t) => per !== "1" || fmtData(new Date(t.prazo)) === hoje() || t.status === "enviada"));
  return out;
}
function metricas(ts) {
  const ag = Date.now(); const m = { previstas: 0, aprovadas: 0, aguardando: 0, atrasadas: 0, abertas: 0, noPrazo: 0, primeira: 0, comAprov: 0, devolvidas: 0, pesoTot: 0, pesoOk: 0 };
  for (const t of ts) {
    if (t.status === "cancelada") continue; m.previstas++;
    Object.values(t.tentativas || {}).forEach((x) => { if (x.revisao?.decisao === "reprovada") m.devolvidas++; });
    const s = statusVisivel(t, ag);
    if (t.status === "aprovada") { m.aprovadas++; if (enviadaNoPrazo(t)) m.noPrazo++; if (t.exigeAprovacao) { m.comAprov++; if (primeiraEnviada(t) === t.n) m.primeira++; } }
    else if (s === "enviada") m.aguardando++; else if (s === "atrasada") m.atrasadas++; else m.abertas++;
    if (t.status === "aprovada" || ag > new Date(t.prazo).getTime()) { m.pesoTot += t.peso || 1; if (t.status === "aprovada") m.pesoOk += t.peso || 1; }
  }
  m.nota = m.pesoTot ? Math.round((m.pesoOk / m.pesoTot) * 1000) / 10 : null; return m;
}
function telaPainel(lojas, compacto) {
  const seg = `<div class="seg" role="group" aria-label="Período">${[["1", "Hoje"], ["7", "7 dias"], ["mes", "Este mês"]].map(([k, l]) => `<button data-action="periodo" data-p="${k}" aria-pressed="${S.painel.periodo === k}">${l}</button>`).join("")}</div>`;
  if (S.painel.periodo === "mes" && !S.painel.extra) { carregarMes(); return seg + `<div class="carregando"><div class="sk"></div></div>`; }
  const tot = metricas(tarefasPeriodo(lojas));
  const kpi = (v, k, d, ruim) => `<div class="kpi ${ruim ? "ruim" : ""}"><span class="v num">${v}</span><span class="k">${k}</span>${d ? `<span class="d">${d}</span>` : ""}</div>`;
  const tabela = lojas.length > 1 ? `<div class="tabela"><table><thead><tr><th>Loja</th><th class="n">Previstas</th><th class="n">Aprovadas</th><th class="n">Para aprovar</th><th class="n">Atrasadas</th><th class="n">Nota ponderada</th></tr></thead><tbody>${lojas.map((l) => { const m = metricas(tarefasPeriodo([l])); return `<tr><td><b>${esc(lojaNome(l))}</b></td><td class="n">${m.previstas}</td><td class="n">${m.aprovadas}</td><td class="n">${m.aguardando}</td><td class="n">${m.atrasadas}</td><td class="n">${fmtPct(m.nota)} <span class="soft small">(${m.pesoTot} pts)</span></td></tr>`; }).join("")}</tbody></table></div>` : "";
  return `${seg}<div class="kpis">${kpi(tot.previstas, "Tarefas previstas", `${tot.abertas} ainda abertas`)}${kpi(tot.aprovadas, "Aprovadas", `${fmtPct(pct(tot.noPrazo, tot.previstas))} no prazo`)}${kpi(tot.aguardando, "Para aprovar", "esperando a gerência")}${kpi(tot.atrasadas, "Atrasadas", "venceram sem envio", tot.atrasadas > 0)}</div>
    <div class="kpis">${kpi(fmtPct(tot.nota), "Nota ponderada", `peso total ${tot.pesoTot}`)}${kpi(fmtPct(pct(tot.primeira, tot.comAprov)), "Aprovadas na 1ª vez", "sem pedido de correção")}${kpi(tot.devolvidas, "Correções pedidas", "no período")}</div>
    ${tabela}<div class="linha">${S.dl ? `<button class="btn secondary" data-action="csv" data-lojas="${esc(lojas.join(","))}">Baixar planilha (CSV)</button>` : ""}</div>${compacto ? "" : ""}`;
}
async function carregarMes() {

async function designar(t, para) {
  if (!t) return; para = para || null;
  if (["enviada", "aprovada", "cancelada"].includes(t.status)) return aviso("Essa tarefa já foi enviada; não dá para trocar a pessoa.", "erro");
  if ((t.responsavel || null) === para) return;
  const x = tentativaAtual(t); const patch = { responsavel: para };
  if (x && !x.envio && !x.encerrada && x.por !== para) { patch.tentativas = { [t.n]: { encerrada: new Date().toISOString(), motivoEncerramento: "passagem" } }; if (t.status === "andamento") patch.status = "pendente"; }
  await atualizarTarefa(t, patch);
  aviso(para ? `Tarefa passada para ${nomeFunc(t.loja, para).replace(/\s*\(exemplo\)/i, "")}.` : "Tarefa voltou para A distribuir.");
}
async function comecar(t) {

  if (t.tipo === "diaria" && Date.now() < new Date(t.inicio).getTime() - 30 * 60000) return aviso(`Esta tarefa começa às ${hm(t.inicio)}.`);
  const x = tentativaAtual(t); if (x && x.por === fid && !x.envio && !x.encerrada) return;
  const n = (t.n || 0) + 1; const patch = { n, status: "andamento", responsavel: fid, tentativas: { [n]: { por: fid, inicio: new Date().toISOString(), respostas: {}, midias: {}, obs: "" } } };
  if (x && !x.envio && !x.encerrada) patch.tentativas[t.n] = { encerrada: new Date().toISOString(), motivoEncerramento: "passagem" };
  await atualizarTarefa(t, patch);
}
async function enviar(t) {

  const f = faltando(t);
  if (f.length) { S.falta = f[0].id; renderSheet(); document.getElementById("item-" + f[0].id)?.scrollIntoView({ behavior: reduzMov() ? "auto" : "smooth", block: "center" }); return aviso({ item: "Marque este item como Feito ou Com problema.", obsitem: "Escreva o que está errado neste item.", midia: "Falta a foto ou o vídeo do que você fez." }[f[0].tipo], "erro"); }
  const agora = new Date().toISOString(); const nc = Object.keys(t.itens || {}).some((iid) => x.respostas?.[iid]?.ok === false);
  const auto = !t.exigeAprovacao && !nc;
  await atualizarTarefa(t, { status: auto ? "aprovada" : "enviada", tentativas: { [t.n]: { envio: agora, ...(auto ? { revisao: { decisao: "aprovada", auto: true, em: agora } } : {}) } } });
  S.aberta = null; S.falta = null; renderSheet(); aviso(auto ? "Enviada e aprovada. Boa!" : "Enviada! A gerência vai aprovar.");
}
async function aprovar(t) {
  if (!t || t.status !== "enviada") return;
  await atualizarTarefa(t, { status: "aprovada", tentativas: { [t.n]: { revisao: { decisao: "aprovada", em: new Date().toISOString() } } } });
  const resta = fila(t.loja).filter((y) => refDe(y) !== refDe(t)).length; aviso(resta ? `Aprovada. Faltam ${resta}.` : "Aprovada. Tudo aprovado por agora.");
  if (S.aberta) { S.aberta = null; renderSheet(); }
}
async function exportarCSV(lojas) {
  const ts = tarefasPeriodo(lojas).sort((a, b) => new Date(a.prazo) - new Date(b.prazo));
  const lin = [["loja", "tipo", "tarefa", "prazo", "status", "responsavel", "enviada_em", "envios", "midias", "motivo_correcao"]];
  for (const t of ts) { const x = tentativaAtual(t); lin.push([lojaNome(t.loja), t.tipo === "mensal" ? "do mês" : "diária", t.titulo, dataHora(t.prazo), STATUS[statusVisivel(t)].l, nomeFunc(t.loja, t.responsavel), x?.envio ? dataHora(x.envio) : "", Object.keys(t.tentativas || {}).length, midiasDe(x).length, x?.revisao?.motivo || ""]); }
  const csv = "﻿" + lin.map((l) => l.map((c) => { const s = String(c ?? ""); return /[";\n]/.test(s) || /^[=+\-@]/.test(s) ? `"${s.replace(/^([=+\-@])/, "'$1").replace(/"/g, '""')}"` : s; }).join(";")).join("\n");
  try { await S.dl.save({ filename: `ede-gestao-${hoje()}.csv`, data: new Blob([csv], { type: "text/csv" }) }); } catch { aviso("O arquivo não foi salvo.", "erro"); }
}
function sairPortal() { S.portal = null; S.quem = null; S.tela = null; S.aberta = null; S.menu = false; S.modal = null; S.filtro = null; local.set("ede.portal", null); render(); renderMenu(); window.scrollTo(0, 0); }
function erroSalvar(e) { console.error(e); return e?.code === "invalid_argument" ? "Você não tem permissão para esta mudança." : "Não consegui salvar. Confira a internet e tente de novo."; }

// ===========================================================================

let drag = null; let suprimirClique = false;
function iniciarArraste() {

  const g = drag.card.cloneNode(true); g.classList.add("fantasma"); g.removeAttribute("data-action"); g.style.width = r.width + "px"; g.style.left = r.left + "px"; g.style.top = r.top + "px"; document.body.appendChild(g);
  drag.g = g; drag.dx = drag.x - r.left; drag.dy = drag.y - r.top; drag.card.classList.add("arrastando"); navigator.vibrate?.(12);
}
function moverArraste(x, y) {

}
function marcarAlvo() {

  document.querySelectorAll(".col.alvo").forEach((c) => { if (c !== col) c.classList.remove("alvo"); }); if (col) col.classList.add("alvo"); drag.col = col;

async function terminarArraste(cancelar) {

  if (S.renderPendente) { S.renderPendente = false; render(); }
}
document.addEventListener("pointerdown", (ev) => {
  const card = ev.target.closest("[data-kcard]"); if (!card || card.dataset.lock || ev.button > 0) return;
  drag = { card, ref: card.dataset.ref, x: ev.clientX, y: ev.clientY, x0: ev.clientX, y0: ev.clientY, ativo: false, toque: ev.pointerType !== "mouse" };
  if (drag.toque) drag.timer = setTimeout(() => { if (drag && !drag.ativo) iniciarArraste(); }, 320);
});
document.addEventListener("pointermove", (ev) => {
  if (!drag) return; const dist = Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0);

  moverArraste(ev.clientX, ev.clientY);
});
document.addEventListener("pointerup", () => terminarArraste(false));
document.addEventListener("pointercancel", () => { if (drag && !drag.ativo) { clearTimeout(drag.timer); drag = null; } else terminarArraste(true); });
document.addEventListener("touchmove", (ev) => { if (drag?.ativo) { ev.preventDefault(); const t = ev.touches[0]; if (t) moverArraste(t.clientX, t.clientY); } }, { passive: false });
document.addEventListener("touchend", () => { if (drag?.ativo) terminarArraste(false); });
document.addEventListener("contextmenu", (ev) => { if (ev.target.closest("[data-kcard]")) ev.preventDefault(); });

// ===========================================================================
// Eventos
// ===========================================================================
document.addEventListener("click", async (ev) => {
  const a = ev.target.closest("[data-action]"); if (!a) return;
  if (suprimirClique && a.closest("[data-kcard]")) { ev.preventDefault(); return; }
  const act = a.dataset.action;
  try {
    if (act === "entrarPortal") { S.portal = a.dataset.loja; local.set("ede.portal", S.portal); carregarQuem(); S.tela = null; S.escopo = "hoje"; S.filtro = null; gerarFaltantes(); render(); window.scrollTo(0, 0); }

    else if (act === "aprovar") { a.disabled = true; await aprovar(acharTarefa(a.dataset.ref)); }
    else if (act === "reprovar") { S.modal = { tipo: "reprovar", ref: a.dataset.ref }; renderModal(); setTimeout(() => $("#motivo")?.focus(), 30); }
    else if (act === "cancelar") { S.modal = { tipo: "cancelar", ref: a.dataset.ref }; renderModal(); setTimeout(() => $("#motivo")?.focus(), 30); }

    else if (act === "tirarMidia") { const t = acharTarefa(S.aberta); const x = tentativaAtual(t); if (!x || x.envio || x.por !== S.quem) return; await atualizarTarefa(t, { tentativas: { [t.n]: { midias: { [a.dataset.mid]: { removida: true } } } } }); await S.db.doc(`midias/${a.dataset.mid}`).update({ removida: true }).catch(() => {}); aviso("Removida. Tire outra se precisar."); }

document.addEventListener("change", async (ev) => {
  const a = ev.target.closest("[data-action]"); if (!a) { const f = ev.target.closest("form[data-action='criar']"); if (f && ev.target.name === "tipo") ajustarNova(f); return; }
  const act = a.dataset.action;
  try {

    else if (act === "obsitem") { const t = acharTarefa(S.aberta); await atualizarTarefa(t, { tentativas: { [t.n]: { respostas: { [a.dataset.item]: { ok: false, obs: a.value.slice(0, 500) } } } } }); }
    else if (act === "padrao") { await S.db.doc(`portais/${S.portal}`).update({ padrao: { [a.dataset.rot]: a.value || null } }); aviso("Responsável padrão salvo."); }

        if (S.falta === "prova") S.falta = null; aviso(act === "foto" ? "Foto enviada." : "Vídeo enviado.");
      } catch (e) { aviso(e?.message || "Não consegui enviar. Tente de novo.", "erro"); }

});
function ajustarNova(f) { const tipo = f.querySelector("input[name='tipo']:checked")?.value || "diaria"; f.querySelectorAll("[data-so]").forEach((el) => { el.hidden = el.dataset.so !== tipo; }); }
document.addEventListener("focusout", () => { setTimeout(() => { if (S.renderPendente && !drag?.ativo && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) { S.renderPendente = false; render(); } const s = $("#sheet"); if (s.dataset.pendente && !s.contains(document.activeElement)) { delete s.dataset.pendente; renderSheet(); } }, 0); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if (drag?.ativo) terminarArraste(true); else if (S.menu) { S.menu = false; renderMenu(); } else if (S.modal) { S.modal = null; renderModal(); } else if (S.aberta) { S.aberta = null; renderSheet(); } } });
document.addEventListener("submit", async (ev) => {
  const f = ev.target; const act = f.dataset.action; if (!act) return; ev.preventDefault();
  const fd = new FormData(f); const loja = S.portal;
  if (document.activeElement && document.activeElement !== document.body && act !== "pin") document.activeElement.blur();
  try {
    if (act === "pin") {
      const h = await sha256Hex(new TextEncoder().encode(loja + ":" + String(fd.get("pin") || "")));
      if (h !== S.portais[loja]?.pinHash) { $("#erroPin").textContent = "PIN errado. Confira com a gerência."; return; }

    } else if (act === "confirmarReprovar" || act === "confirmarCancelar") {

      if (act === "confirmarReprovar") await atualizarTarefa(t, { status: "correcao", tentativas: { [t.n]: { revisao: { decisao: "reprovada", em: new Date().toISOString(), motivo: motivo.slice(0, 1000) } } } });
      else await atualizarTarefa(t, { status: "cancelada", cancelamento: { em: new Date().toISOString(), motivo: motivo.slice(0, 1000) } });
      S.modal = null; renderModal(); S.aberta = null; renderSheet(); aviso(act === "confirmarReprovar" ? "Correção pedida. O funcionário vai ver o motivo." : "Tarefa cancelada.");
    } else if (act === "criar") {
      const titulo = String(fd.get("titulo") || "").trim(); const tipo = fd.get("tipo") || "diaria"; const agora = Date.now();
      let prazo = null;
      if (tipo === "diaria") { const p = fd.get("prazoDia"); prazo = p === "1" ? new Date(agora + 3600e3).toISOString() : p === "2" ? new Date(agora + 7200e3).toISOString() : p === "18" ? isoLocal(hoje(), "18:00") : (fd.get("hora") ? isoLocal(hoje(), fd.get("hora")) : null); }
      else { const d = fd.get("dataMes"); prazo = d && d.slice(0, 7) === mesAtual() ? isoLocal(d, "18:00") : null; }
      const erro = !temTexto(titulo) ? "Escreva o que precisa ser feito." : !prazo ? (tipo === "diaria" ? "Escolha até quando (ou um horário)." : "Escolha uma data deste mês.") : new Date(prazo).getTime() < agora + 5 * 60000 ? "Esse prazo já passou. Escolha um mais tarde." : null;
      if (erro) { $("#erroNova").textContent = erro; return; }
      const linhas = String(fd.get("itens") || "").split("\n").map((s) => s.trim()).filter(Boolean).slice(0, 20);
      const col = tipo === "mensal" ? "mensais" : "diarias"; const chave = tipo === "mensal" ? mesAtual() : hoje(); const id = docId(loja, chave); const ref = S.db.doc(`${col}/${id}`);
      const snap = await ref.get(); if (!snap.exists) await ref.set(tipo === "mensal" ? { loja, mes: chave, criadoEm: new Date().toISOString(), tarefas: montar(loja, "mensal", chave) } : { loja, data: chave, criadoEm: new Date().toISOString(), tarefas: montar(loja, "diaria", chave) });
      await ref.update({ tarefas: { [uid("a_")]: { avulsa: true, titulo: titulo.slice(0, 120), instrucoes: String(fd.get("instrucoes") || "").slice(0, 1000), responsavel: fd.get("resp") || null, inicio: new Date(agora).toISOString(), prazo,
        exigeMidia: fd.get("exigeMidia") === "on", exigeAprovacao: fd.get("exigeAprovacao") === "on", peso: 2, itens: Object.fromEntries(linhas.map((tx, i) => [`i${i + 1}`, { texto: tx.slice(0, 200), ordem: i + 1, critico: false, peso: 1 }])), status: "pendente", n: 0, tentativas: {} } } });
      S.escopo = tipo === "mensal" ? "mes" : "hoje"; S.tela = "quadro"; render(); window.scrollTo(0, 0); aviso("Tarefa criada.");
    } else if (act === "addFunc") {
      const nome = String(fd.get("nome") || "").trim(); if (!temTexto(nome)) { $("#erroFunc").textContent = "Escreva o nome do funcionário."; return; }
      await S.db.doc(`portais/${loja}`).update({ funcionarios: { [uid("f_")]: { nome: nome.slice(0, 60), funcao: String(fd.get("funcao") || "").slice(0, 40), ativo: true, criadoEm: new Date().toISOString() } } });
      f.reset(); aviso("Funcionário cadastrado.");
    } else if (act === "salvarFunc") {
      const nome = String(fd.get("nome") || "").trim(); if (!temTexto(nome)) { $("#erroDlg").textContent = "O nome não pode ficar vazio."; return; }
      await S.db.doc(`portais/${loja}`).update({ funcionarios: { [S.modal.id]: { nome: nome.slice(0, 60), funcao: String(fd.get("funcao") || "").slice(0, 40), ativo: fd.get("ativo") === "on" } } });
      S.modal = null; renderModal(); aviso("Funcionário salvo.");
    } else if (act === "salvarPin") {
      const p = String(fd.get("novoPin") || ""); if (!/^\d{4,8}$/.test(p)) { $("#erroPinCfg").textContent = "O PIN precisa ter de 4 a 8 números."; return; }
      const h = await sha256Hex(new TextEncoder().encode(loja + ":" + p)); await S.db.doc(`portais/${loja}`).update({ pinHash: h }); sessao.set("ede.lib." + loja, h); f.reset(); aviso("PIN salvo. Anote e passe só para quem é da gerência.");
    }
  } catch (e) { const el = $("#erroDlg") || $("#erroNova") || $("#erroFunc"); const m = erroSalvar(e); if (el) el.textContent = m; else aviso(m, "erro"); }
});
const obsNova = new MutationObserver(() => { const f = document.querySelector("form[data-action='criar']"); if (f && !f.dataset.ok) { f.dataset.ok = "1"; ajustarNova(f); } });
obsNova.observe(document.getElementById("root"), { childList: true, subtree: true });

render();
iniciar().catch((e) => { console.error(e); S.erroGeral = "semdb"; render(); });
})();
