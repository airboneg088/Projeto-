<title>Éde Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de loja no polegar — topo laranja enxuto, navegação fixa embaixo (no computador vira barra no topo), uma ação principal por tela. */
:root {
  --bg: #fff4e8; --surface: #ffffff; --surface-2: #f3e6d6; --line: #e3cfba;
  --ink: #2a1810; --ink-soft: #6b5a50; --brand: #ee5d06; --action: #c2470a; --action-ink: #ffffff;
  --focus: #2a1810; --danger: #a8291f; --danger-bg: #fbe4e1; --ok: #1b5b2e; --ok-bg: #dfefe1;
  --s-pend-bg: #f7f0e8; --s-pend-fg: #4a3a30; --s-pend-bd: #b9a797;
  --s-and-bg: #e1ebf5; --s-and-fg: #1c4a78;
  --s-agu-bg: #fbedc4; --s-agu-fg: #664500;
  --s-apr-bg: #dfefe1; --s-apr-fg: #1b5b2e;
  --s-cor-bg: #e6c3e0; --s-cor-fg: #5a1f56;
  --s-atr-bg: #b3261e; --s-atr-fg: #ffffff;
  --s-can-bg: #f1ece7; --s-can-fg: #5c514a; --s-can-bd: #a39486;
  --font-display: "Bitter", Rockwell, Georgia, serif;
  --font-text: "Figtree", Arial, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --r-s: 8px; --r-m: 14px; --r-pill: 999px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a100b; --surface: #26180f; --surface-2: #33231a; --line: #4a3428; --ink: #fff4e8; --ink-soft: #d2bfb0;
  --brand: #ee5d06; --action: #f07a3c; --action-ink: #1a0d06; --focus: #ffc9a6; --danger: #ff8f84; --danger-bg: #3b1714; --ok: #8fd4a8; --ok-bg: #163421;
  --s-pend-bg: #2b2019; --s-pend-fg: #ede1d6; --s-pend-bd: #6e5d51; --s-and-bg: #1b2d42; --s-and-fg: #bbd6f2;
  --s-agu-bg: #3b2d0c; --s-agu-fg: #f4d58e; --s-apr-bg: #163421; --s-apr-fg: #abddb6; --s-cor-bg: #5e2d59; --s-cor-fg: #fbe3f7;
  --s-atr-bg: #f2877d; --s-atr-fg: #2b0b07; --s-can-bg: #2a221d; --s-can-fg: #bfb2a7; --s-can-bd: #6e6158; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1a100b; --surface: #26180f; --surface-2: #33231a; --line: #4a3428; --ink: #fff4e8; --ink-soft: #d2bfb0;
  --brand: #ee5d06; --action: #f07a3c; --action-ink: #1a0d06; --focus: #ffc9a6; --danger: #ff8f84; --danger-bg: #3b1714; --ok: #8fd4a8; --ok-bg: #163421;
  --s-pend-bg: #2b2019; --s-pend-fg: #ede1d6; --s-pend-bd: #6e5d51; --s-and-bg: #1b2d42; --s-and-fg: #bbd6f2;
  --s-agu-bg: #3b2d0c; --s-agu-fg: #f4d58e; --s-apr-bg: #163421; --s-apr-fg: #abddb6; --s-cor-bg: #5e2d59; --s-cor-fg: #fbe3f7;
  --s-atr-bg: #f2877d; --s-atr-fg: #2b0b07; --s-can-bg: #2a221d; --s-can-fg: #bfb2a7; --s-can-bd: #6e6158; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
select { max-width: 100%; min-width: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.15; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 700; line-height: 1.3; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.soft { color: var(--ink-soft); }
.small { font-size: 14px; }

/* Topo */
.top { background: var(--brand); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff; white-space: nowrap; flex: none; }
@media (max-width: 380px) { .marca { font-size: 17px; } }
.marca img { width: 32px; height: 32px; border-radius: 8px; display: block; box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
.conta { margin-left: auto; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: var(--r-pill); padding: 4px 6px 4px 14px; min-height: 44px; cursor: pointer; min-width: 0; flex: 0 1 auto; }
.conta .t { display: grid; text-align: right; line-height: 1.15; min-width: 0; }
.conta .t b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conta .t span { font-size: 12px; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--action); display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
.vendo { background: var(--s-agu-bg); color: var(--s-agu-fg); font-size: 14px; font-weight: 700; }
.vendo .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.vendo button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 700; min-height: 44px; cursor: pointer; }

/* Navegação: embaixo no celular, no topo no computador */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav button { position: relative; border: 0; background: none; min-height: var(--nav-h); display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--ink-soft); cursor: pointer; transition: transform 140ms var(--ease-out); }
.nav button:active { transform: scale(0.96); }
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--action); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--action); }
.nav .n { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--s-atr-bg); color: var(--s-atr-fg); font-size: 12px; line-height: 20px; }
main .wrap { padding-block: 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
@media (min-width: 900px) {
  .nav { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; }
  .nav .wrap { grid-auto-flow: column; grid-auto-columns: max-content; justify-content: start; gap: 6px; }
  .nav button { grid-auto-flow: column; gap: 8px; min-height: 52px; padding: 0 14px; font-size: 15px; }
  .nav button svg { width: 22px; height: 22px; }
  .nav button[aria-current="page"]::before { top: auto; bottom: 0; left: 10px; right: 10px; border-radius: 3px 3px 0 0; }
  .nav .n { position: static; }
  main .wrap { padding-block: 24px 64px; }
}

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: var(--r-m); border: 1px solid transparent; font-weight: 800; font-size: 17px; cursor: pointer; transition: transform 160ms var(--ease-out); text-decoration: none; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--action); color: var(--action-ink); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn.ghost { background: none; color: var(--ink); border-color: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
@media (hover: hover) and (pointer: fine) { .btn.primary:hover { filter: brightness(1.07); } .btn.secondary:hover, .linha-t:hover { background: var(--surface-2); } }
@media (prefers-reduced-motion: reduce) { .btn, .nav button, .op { transition: none !important; } .btn:active, .nav button:active { transform: none; } }

/* Status */
.st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.st svg { flex: none; width: 15px; height: 15px; }
.st.pendente { background: var(--s-pend-bg); color: var(--s-pend-fg); border-color: var(--s-pend-bd); }
.st.andamento { background: var(--s-and-bg); color: var(--s-and-fg); }
.st.enviada { background: var(--s-agu-bg); color: var(--s-agu-fg); }
.st.aprovada { background: var(--s-apr-bg); color: var(--s-apr-fg); }
.st.correcao { background: var(--s-cor-bg); color: var(--s-cor-fg); }
.st.atrasada { background: var(--s-atr-bg); color: var(--s-atr-fg); }
.st.cancelada { background: var(--s-can-bg); color: var(--s-can-fg); border-color: var(--s-can-bd); border-style: dashed; }

/* Hoje */
.ola { display: grid; gap: 4px; }
.progresso { display: grid; gap: 8px; }
.barra-p { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.barra-p i { display: block; height: 100%; background: var(--ok); border-radius: 5px; transition: width 300ms var(--ease-out); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.alerta { border-color: var(--s-atr-bg); color: var(--danger); }
.chip.alerta[aria-pressed="true"] { background: var(--s-atr-bg); color: var(--s-atr-fg); }
.agora { background: var(--surface); border: 2px solid var(--action); border-radius: var(--r-m); padding: 18px; display: grid; gap: 12px; }
.agora.atr { border-color: var(--s-atr-bg); }
.agora .rot { font-size: 13px; font-weight: 800; color: var(--action); letter-spacing: .02em; }
.agora.atr .rot { color: var(--danger); }
.agora h2 { font-size: 24px; }
.agora .q { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-soft); font-size: 15px; }
.req { display: flex; flex-wrap: wrap; gap: 6px; }
.req span { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-soft); }
.req svg { width: 15px; height: 15px; }
.aviso-cor { background: var(--s-cor-bg); color: var(--s-cor-fg); border-radius: var(--r-s); padding: 10px 12px; font-weight: 600; font-size: 15px; }
.lista { display: grid; gap: 8px; }
.lista > h3 { font-size: 15px; color: var(--ink-soft); margin-top: 6px; }
.linha-t { width: 100%; display: grid; grid-template-columns: 58px minmax(0,1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; cursor: pointer; min-height: 64px; }
.linha-t .h { font-weight: 800; font-size: 17px; line-height: 1.1; }
.linha-t .h small { display: block; font-weight: 600; font-size: 12px; color: var(--ink-soft); }
.linha-t .tt { font-weight: 700; display: block; }
.linha-t .m { display: block; font-size: 13px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha-t.feita { opacity: .78; }
.vazio { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 26px 20px; display: grid; gap: 10px; text-align: center; justify-items: center; }
.vazio .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; }
.vazio p { color: var(--ink-soft); max-width: 44ch; }
details.feitas summary { cursor: pointer; font-weight: 700; color: var(--ink-soft); min-height: 44px; display: flex; align-items: center; }

/* Folha da tarefa */
#sheet, #modal { position: fixed; inset: 0; z-index: 30; }
#sheet[hidden], #modal[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(26,16,11,.55); }
.folha { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.folha .cab { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 2; padding-top: env(safe-area-inset-top, 0px); }
.folha .cab .wrap { display: flex; align-items: center; gap: 8px; min-height: 60px; }
.folha .cab h2 { font-size: 19px; flex: 1; min-width: 0; }
.voltar { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.folha .corpo { padding-block: 16px calc(150px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 900px) { .folha { left: 50%; transform: translateX(-50%); width: min(760px, 100%); box-shadow: 0 0 0 1px var(--line), 0 24px 64px rgba(26,16,11,.35); } }
.info { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 10px; }
.info .q { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--ink-soft); }
.info .q b { color: var(--ink); }
details.como summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; color: var(--action); }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 12px; scroll-margin-top: 80px; }
.item.falta { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-bg); }
.item .tx { font-weight: 700; font-size: 17px; }
.item .tx .n { color: var(--ink-soft); font-weight: 800; margin-right: 6px; }
.ops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.op { min-height: 52px; border-radius: var(--r-m); border: 2px solid var(--line); background: var(--surface); font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform 140ms var(--ease-out); }
.op:active { transform: scale(0.97); }
.op svg { width: 22px; height: 22px; }
.op.feito[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.op.prob[aria-pressed="true"] { background: var(--s-cor-bg); border-color: var(--s-cor-fg); color: var(--s-cor-fg); }
.op.feito svg path { stroke-dasharray: 24; stroke-dashoffset: 0; }
.op.feito[aria-pressed="true"] svg path { animation: traço 200ms var(--ease-out); }
@keyframes traço { from { stroke-dashoffset: 24; } }
@media (prefers-reduced-motion: reduce) { .op.feito[aria-pressed="true"] svg path { animation: none; } }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-soft); }
.tag.crit { background: var(--s-atr-bg); color: var(--s-atr-fg); }
.tag.obr { background: var(--danger-bg); color: var(--danger); }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fotos img { width: 84px; height: 84px; object-fit: cover; border-radius: var(--r-s); border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
.foto-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: var(--r-m); border: 2px dashed var(--action); color: var(--action); font-weight: 800; cursor: pointer; background: var(--surface); }
.foto-btn.ok { border-style: solid; border-color: var(--line); color: var(--ink-soft); font-weight: 700; }
.foto-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
label.f { display: grid; gap: 6px; font-weight: 700; }
input[type="text"], input[type="time"], input[type="number"], select.f, textarea { background: var(--surface); border: 1px solid var(--s-pend-bd); border-radius: var(--r-s); padding: 12px; min-height: 52px; width: 100%; }
textarea { min-height: 92px; resize: vertical; }
.chk { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; }
.chk input { width: 24px; height: 24px; accent-color: var(--action); flex: none; }
.acao { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 3; }
.acao .wrap { display: grid; gap: 6px; padding-block: 10px; }
.acao .falta-txt { font-size: 14px; font-weight: 700; color: var(--danger); text-align: center; }
.acao .bts { display: flex; gap: 10px; }
.acao .bts .btn { flex: 1; }
@media (min-width: 900px) { .acao { position: sticky; } }
.hist { display: grid; gap: 10px; }

/* Aprovação */
.rev { display: grid; gap: 14px; }
.rev-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.navrev { display: flex; align-items: center; gap: 6px; }
.navrev button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.galeria { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: var(--r-m); }
.galeria img { flex: none; width: min(100%, 520px); aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-m); scroll-snap-align: start; background: var(--surface-2); cursor: zoom-in; }
.sem-foto { aspect-ratio: 4 / 3; width: 100%; max-width: 520px; display: grid; place-items: center; border-radius: var(--r-m); background: var(--surface-2); color: var(--ink-soft); font-weight: 600; }
.alerta { background: var(--s-agu-bg); color: var(--s-agu-fg); border-radius: var(--r-s); padding: 10px 12px; font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: flex-start; }
.alerta svg { flex: none; margin-top: 3px; }
.resp { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.resp li { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 10px; font-size: 15px; }
.resp li svg { margin-top: 3px; }
.resp .nc { color: var(--s-cor-fg); font-weight: 700; }
.box-prob { background: var(--s-cor-bg); color: var(--s-cor-fg); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 8px; }
@media (min-width: 900px) { .rev-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; } }

/* Diálogo, foto ampliada, aviso */
.dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: var(--r-m); padding: 20px; display: grid; gap: 14px; box-shadow: 0 18px 48px rgba(26,16,11,.35); animation: entra 200ms var(--ease-out); }
@keyframes entra { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .dlg { animation: none; } }
.menu { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(60px + env(safe-area-inset-top, 0px)); width: min(360px, calc(100% - 24px)); background: var(--surface); border-radius: var(--r-m); padding: 8px; display: grid; gap: 2px; box-shadow: 0 18px 48px rgba(26,16,11,.35); transform-origin: top right; animation: abre 180ms var(--ease-out); }
@keyframes abre { from { opacity: 0; transform: scale(.96); } }
.menu .eu { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; display: grid; gap: 2px; }
.menu button, .menu .lnk { text-align: left; border: 0; background: none; min-height: 48px; padding: 0 12px; border-radius: var(--r-s); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; }
@media (hover: hover) and (pointer: fine) { .menu button:hover { background: var(--surface-2); } }

async function comecarTarefa(t) {
  const p = minhaPessoa(); if (!t || !podeExecutar(t, p)) return false;
  if (Date.now() < new Date(t.inicio).getTime()) { aviso(`Esta tarefa começa às ${hm(t.inicio)}.`); return false; }
  const atual = tentativaAtual(t);
  if (atual && !atual.envio && !atual.encerrada && atual.por === p.id) return true;
  if (atual && !atual.envio && !atual.encerrada && atual.por !== p.id) {
    const outro = S.pessoas[atual.por]; if (outro && podeExecutar(t, { id: atual.por, ...outro })) { aviso("Outra pessoa já está fazendo esta tarefa."); return false; }
    await atualizarTarefa(t, { tentativas: { [t.n]: { encerrada: new Date().toISOString(), motivoEncerramento: "passagem" } } }); // D52
  }
  const n = (t.n || 0) + 1;
  await atualizarTarefa(t, { n, status: "andamento", tentativas: { [n]: { por: p.id, inicio: new Date().toISOString(), respostas: {}, fotos: {}, obs: "" } } });
  return true;
}
async function responder(iid, valor) { const t = tarefaAberta(); const tent = tentativaAtual(t); if (!tent || tent.envio) return; if (S.falta === iid) S.falta = null; await atualizarTarefa(t, { tentativas: { [t.n]: { respostas: { [iid]: valor } } } }); }
async function enviar() {
  const t = tarefaAberta(); const p = minhaPessoa(); const tent = tentativaAtual(t); if (!t || !tent || tent.envio || tent.por !== p.id) return;
  const f = faltando(t);
  if (f.length) {
    S.falta = f[0].id; renderSheet();
    const alvo = document.getElementById("item-" + f[0].id); alvo?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
    const txt = { item: "Marque este item como Feito ou Com problema.", obsitem: "Escreva o que está errado neste item.", foto: "Tire a foto deste item.", fotogeral: "Falta a foto geral.", obs: "Escreva a observação." }[f[0].tipo];
    return aviso(txt, "erro");
  }
  const agora = new Date().toISOString(); const naoConforme = Object.keys(t.itens || {}).some((iid) => tent.respostas[iid]?.ok === false);
  const auto = !t.exigeAprovacao && !naoConforme; // D47
  await atualizarTarefa(t, { status: auto ? "aprovada" : "enviada", tentativas: { [t.n]: { envio: agora, ...(auto ? { revisao: { decisao: "aprovada", auto: true, em: agora } } : {}) } } });
  S.aberta = null; S.falta = null; renderSheet(); aviso(auto ? "Enviada e aprovada. Boa!" : "Enviada. Agora é com o gerente.");
}
async function aprovar(t) {
  const p = minhaPessoa(); const tent = tentativaAtual(t); if (!t || t.status !== "enviada" || !tent) return;
  if (tent.por === p.id) return aviso("Outra pessoa precisa revisar o que você fez.", "erro");
  await atualizarTarefa(t, { status: "aprovada", tentativas: { [t.n]: { revisao: { decisao: "aprovada", por: p.id, em: new Date().toISOString() } } } });
  const resta = filaAprovacao(p).filter((x) => !(x.id === t.id && x.loja === t.loja && x.data === t.data)).length;
  aviso(resta === 0 ? "Aprovada. Tudo revisado por hoje." : `Aprovada. Faltam ${resta}.`);
  if (S.aberta) { S.aberta = null; renderSheet(); }
}

function abrirCancelar(t) { S.modal = { tipo: "cancelar", t: { loja: t.loja, data: t.data, id: t.id }, motivo: "" }; renderModal(); setTimeout(() => $("#motivo")?.focus(), 30); }

document.addEventListener("click", async (ev) => {
  const a = ev.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action;
  try {
    if (act === "nav") { S.nav = a.dataset.nav; S.sub = null; S.filtro = null; S.aprIdx = 0; render(); window.scrollTo(0, 0); }
    else if (act === "sub") { if (a.dataset.sub === "nova") { S.nav = "mais"; S.sub = "nova"; } else S.sub = a.dataset.sub || null; render(); window.scrollTo(0, 0); }
    else if (act === "conta") { S.menu = !S.menu; renderMenu(); }
    else if (act === "fecharMenu") { if (ev.target === a || a.tagName === "BUTTON") { S.menu = false; renderMenu(); } }
    else if (act === "ajuda") { S.menu = false; renderMenu(); S.modal = { tipo: "ajuda" }; renderModal(); }
    else if (act === "demoSair") { S.demoAs = null; local.set("ede.demoAs", null); S.nav = null; S.aberta = null; render(); }
    else if (act === "filtro") { S.filtro = a.dataset.f || null; render(); }
    else if (act === "lojaSel") { S.lojaSel = a.dataset.l; local.set("ede.loja", a.dataset.l); S.aprIdx = 0; render(); }
    else if (act === "abrir") { S.aberta = { loja: a.dataset.loja, data: a.dataset.data, id: a.dataset.id }; S.falta = null; renderSheet(); }
    else if (act === "comecarJa") { a.disabled = true; const t = tarefaPorDataset(a.dataset); if (await comecarTarefa(t)) { S.aberta = { loja: t.loja, data: t.data, id: t.id }; S.falta = null; renderSheet(); } else a.disabled = false; }
    else if (act === "fechar") { S.aberta = null; S.falta = null; renderSheet(); }
    else if (act === "comecar") { a.disabled = true; await comecarTarefa(tarefaAberta()); }
    else if (act === "op") { const t = tarefaAberta(); const r = tentativaAtual(t)?.respostas?.[a.dataset.item]; const quer = a.dataset.v === "feito";
      if (quer) await responder(a.dataset.item, r?.ok === true ? { ok: null, obs: "" } : { ok: true, obs: "" });
      else await responder(a.dataset.item, r?.ok === false ? { ok: null, obs: "" } : { ok: false, obs: r?.obs || "" }); }
    else if (act === "enviar") { a.disabled = true; await enviar(); a.disabled = false; }
    else if (act === "aprovar") { const t = a.dataset.id ? tarefaPorDataset(a.dataset) : tarefaAberta(); a.disabled = true; await aprovar(t); }
    else if (act === "reprovar") { abrirReprovar(a.dataset.id ? tarefaPorDataset(a.dataset) : tarefaAberta()); }
    else if (act === "cancelar") { abrirCancelar(tarefaAberta()); }
    else if (act === "revnav") { S.aprIdx += Number(a.dataset.d); render(); window.scrollTo(0, 0); }
    else if (act === "fecharModal") { if (ev.target === a || a.tagName === "BUTTON") { S.modal = null; renderModal(); } }
    else if (act === "zoom") { await carregarFoto(a.dataset.foto); S.modal = { tipo: "zoom", id: a.dataset.foto }; renderModal(); }
    else if (act === "periodo") { S.painel.periodo = a.dataset.p; if (a.dataset.p === "30") S.painel.dias = null; render(); }
    else if (act === "detalheLoja") { S.painel.lojaDetalhe = a.dataset.loja && S.painel.lojaDetalhe !== a.dataset.loja ? a.dataset.loja : null; render(); }
    else if (act === "editarRotina") { S.modal = { tipo: "rotina", id: a.dataset.id }; renderModal(); }

  } catch (e) { console.error(e); aviso(e?.code === "invalid_argument" ? "Você não tem permissão para esta mudança. Peça acesso de edição à proprietária." : "Não consegui salvar. Confira a internet e tente de novo.", "erro"); }
});
document.addEventListener("input", (ev) => {

document.addEventListener("change", async (ev) => {

  try {

      try { await processarFoto(file, t, tent, a.dataset.item || null); if (S.falta === (a.dataset.item || "geral")) S.falta = null; } catch (e) { aviso(e.message || "Não consegui enviar a foto. Tente de novo.", "erro"); }

});
document.addEventListener("focusout", () => { setTimeout(() => { if (S.renderPendente && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) { S.renderPendente = false; render(); } const s = $("#sheet"); if (s.dataset.pendente && !s.contains(document.activeElement)) { delete s.dataset.pendente; renderSheet(); } }, 0); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if (S.menu) { S.menu = false; renderMenu(); } else if (S.modal) { S.modal = null; renderModal(); } else if (S.aberta) { S.aberta = null; renderSheet(); } } });
document.addEventListener("submit", async (ev) => {
  const f = ev.target; const act = f.dataset.action; if (!act) return; ev.preventDefault();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  const p = minhaPessoa(); const fd = new FormData(f);
  try {
    if (act === "confirmarReprovar") {
      if (!temTexto(S.modal.motivo)) { $("#erroDlg").textContent = "Escreva o que precisa ser corrigido. Quem fez a tarefa vai ler isso."; return; }
      const t = tarefaPorDataset(S.modal.t); const tent = tentativaAtual(t);
      if (tent.por === p.id) { $("#erroDlg").textContent = "Outra pessoa precisa revisar o que você fez."; return; }
      const itens = Object.fromEntries(Object.entries(S.modal.itens).filter(([, v]) => v));
      await atualizarTarefa(t, { status: "correcao", tentativas: { [t.n]: { revisao: { decisao: "reprovada", por: p.id, em: new Date().toISOString(), motivo: S.modal.motivo.trim().slice(0, 1000), itens } } } });
      S.modal = null; renderModal(); S.aberta = null; renderSheet(); aviso("Correção pedida. A pessoa vai ver o motivo.");
    } else if (act === "confirmarCancelar") {
      if (!temTexto(S.modal.motivo)) { $("#erroDlg").textContent = "Escreva o motivo do cancelamento."; return; }
      const t = tarefaPorDataset(S.modal.t);
      const jaEnviada = Object.values(t.tentativas || {}).some((x) => x.envio); const venceu = Date.now() > new Date(t.prazo).getTime();
      if (p.papel !== "proprietaria" && (jaEnviada || venceu)) { $("#erroDlg").textContent = "Tarefa vencida ou já enviada só a proprietária cancela."; return; }
      await atualizarTarefa(t, { status: "cancelada", cancelamento: { por: p.id, em: new Date().toISOString(), motivo: S.modal.motivo.trim().slice(0, 1000) } });
      S.modal = null; renderModal(); S.aberta = null; renderSheet(); aviso("Tarefa cancelada.");
    } else if (act === "criar") {
      const loja = fd.get("loja"); const titulo = String(fd.get("titulo") || "").trim(); const data = hoje();
      const pz = fd.get("prazo"); const agora = Date.now();
      let fimIso = pz === "1" ? new Date(agora + 3600e3).toISOString() : pz === "2" ? new Date(agora + 7200e3).toISOString() : pz === "fim" ? isoLocal(data, "18:00") : (fd.get("fim") ? isoLocal(data, fd.get("fim")) : null);
      const linhas = String(fd.get("itens") || "").split("\n").map((s) => s.trim()).filter(Boolean);
      const erro = !temTexto(titulo) ? "Escreva o que precisa ser feito." : !fimIso ? "Escolha até quando (ou um horário)." : fimIso <= new Date(agora + 5 * 60000).toISOString() ? "Esse horário já passou. Escolha um prazo mais tarde." : null;
      if (erro) { $("#erroNova").textContent = erro; return; }
      const [tipo, alvo] = String(fd.get("quem") || "").split(":");
      const setor = tipo === "setor" ? alvo : (S.pessoas[alvo]?.setor || Object.keys(S.org.setores)[0]);
      const itens = (linhas.length ? linhas : [titulo]).slice(0, 20);
      const ref = S.db.doc(`dias/${loja}_${data}`); const snap = await ref.get();
      if (!snap.exists) await ref.set({ loja, data, criadoEm: new Date().toISOString(), tarefas: montarTarefas(loja, data) });
      await ref.update({ tarefas: { [uid("a_")]: { avulsa: true, criadaPor: p.id, titulo: titulo.slice(0, 120), instrucoes: "", setor, responsavel: tipo === "pessoa" ? alvo : null,
        inicio: new Date(agora).toISOString(), prazo: fimIso, exigeFoto: fd.get("exigeFoto") === "on", exigeObs: false, exigeAprovacao: fd.get("exigeAprovacao") === "on", peso: 2,
        itens: Object.fromEntries(itens.map((tx, i) => [`i${i + 1}`, { texto: tx.slice(0, 200), ordem: i + 1, critico: false, foto: false, peso: 1 }])), status: "pendente", n: 0, tentativas: {} } } });
      f.reset(); S.nav = "dia"; S.sub = null; render(); window.scrollTo(0, 0); aviso("Tarefa criada. A equipe já vê.");
    } else if (act === "salvarRotina") {
      const r = S.rotinas[S.modal.id]; const ini = fd.get("inicio"), fim = fd.get("fim"); const peso = Number(fd.get("peso"));
      if (!ini || !fim || fim <= ini) { $("#erroDlg").textContent = "O prazo precisa ser depois do início, no mesmo dia."; return; }
      if (!(peso >= 1 && peso <= 5)) { $("#erroDlg").textContent = "O peso vai de 1 a 5."; return; }
      const lojas = Object.fromEntries(Object.keys(S.org.lojas).map((k) => [k, fd.get("loja_" + k) === "on"]));
      await S.db.doc("config/rotinas").update({ rotinas: { [S.modal.id]: { inicio: ini, fim, peso, lojas, ativa: fd.get("ativa") === "on", versao: (r.versao || 1) + 1 } } });
      S.modal = null; renderModal(); aviso("Rotina salva. Vale a partir de amanhã.");
    } else if (act === "addPessoa") {
      const id = fd.get("id"); if (!id) { $("#erroPessoa").textContent = "Busque e toque no nome da pessoa (passo 1)."; return; }
      const papel = fd.get("papel"); const loja = fd.get("loja") || null;
      if ((papel === "colaborador" || papel === "gerente") && !loja) { $("#erroPessoa").textContent = "Colaborador e gerente precisam de uma loja (passo 3)."; return; }
      await S.db.doc("config/pessoas").update({ pessoas: { [id]: { papel, loja: papel === "proprietaria" || papel === "admin" ? null : loja, setor: papel === "colaborador" ? (fd.get("setor") || null) : null, ativo: true } } });
      f.reset(); $("#escolhido").textContent = "Ninguém escolhido ainda."; aviso("Pessoa salva. Ela já pode abrir o site.");
    }
  } catch (e) { console.error(e); const el = $("#erroDlg") || $("#erroNova") || $("#erroPessoa"); const m = e?.code === "invalid_argument" ? "Você não tem permissão para esta mudança. Peça acesso de edição à proprietária." : "Não consegui salvar. Confira a internet e tente de novo."; if (el) el.textContent = m; else aviso(m, "erro"); }
});

function diasDoPainel() { return S.painel.periodo === "30" ? S.painel.dias : S.dias; }
function metricas(ts) {
  const agora = Date.now(); const m = { previstas: 0, executadas: 0, aprovadas: 0, aguardando: 0, atrasadas: 0, pendentes: 0, naJanela: 0, primeira: 0, comAprov: 0, devolvidas: 0, somaRev: 0, nRev: 0, pesoTot: 0, pesoOk: 0, criticos: 0, falhas: {} };
  for (const t of ts) {
    if (t.status === "cancelada") continue; m.previstas++;
    const tents = Object.values(t.tentativas || {});
    if (tents.some((x) => x.envio)) m.executadas++;
    tents.forEach((x) => { if (x.revisao && x.revisao.decisao === "reprovada") { m.devolvidas++; Object.keys(x.revisao.itens || {}).forEach((iid) => { const it = t.itens?.[iid]; if (!it) return; const k = `${t.rotina || "avulsa"}|${it.texto}`; m.falhas[k] = (m.falhas[k] || 0) + 1; if (it.critico) m.criticos++; }); }
      if (x.revisao && !x.revisao.auto && x.envio) { m.somaRev += (new Date(x.revisao.em) - new Date(x.envio)) / 60000; m.nRev++; } });
    const s = statusVisivel(t, agora);
    if (t.status === "aprovada") { m.aprovadas++; if (enviadaNoPrazo(t)) m.naJanela++; if (t.exigeAprovacao) { m.comAprov++; if (primeiraEnviada(t) === t.n) m.primeira++; } }
    else if (s === "enviada") m.aguardando++;
    else if (s === "atrasada") m.atrasadas++;
    else m.pendentes++;
    const fechada = t.status === "aprovada" || agora > new Date(t.prazo).getTime();
    if (fechada) { m.pesoTot += t.peso || 1; if (t.status === "aprovada") m.pesoOk += t.peso || 1; }
  }
  m.nota = m.pesoTot ? Math.round((m.pesoOk / m.pesoTot) * 1000) / 10 : null;
  return m;
}
function tarefasPeriodo(lojas) {
  const fonte = diasDoPainel() || {}; const ini = somaDias(hoje(), S.painel.periodo === "1" ? 0 : S.painel.periodo === "7" ? -6 : -29);
  return Object.entries(fonte).filter(([, d]) => d.data >= ini && lojas.includes(d.loja)).flatMap(([, d]) => tarefasDoDia2(d));
}
function tarefasDoDia2(d) { return Object.entries(d.tarefas || {}).map(([id, t]) => ({ id, loja: d.loja, data: d.data, ...t })); }
async function carregar30() {
  if (S.painel.carregando) return; S.painel.carregando = true;
  try { const q = await S.db.collection("dias").where("data", ">=", somaDias(hoje(), -29)).get(); const o = {}; q.docs.forEach((d) => { o[d.id] = d.data(); }); S.painel.dias = o; }
  catch { aviso("Não consegui carregar 30 dias. Tente de novo.", "erro"); S.painel.periodo = "7"; }
  S.painel.carregando = false; render();
}
async function buscar(q) {
  const box = $("#resBusca"); if (!box || !S.user) return;
  const hits = await S.user.search(q || ""); S.perfis = { ...S.perfis, ...Object.fromEntries(hits.map((h) => [h.id, h])) };
  box.innerHTML = hits.map((h) => `<button type="button" class="btn secondary small" style="justify-content:flex-start" data-action="escolherPessoa" data-id="${esc(h.id)}" data-nome="${esc(h.name)}">${esc(h.name)}</button>`).join("") || '<p class="nota">Ninguém encontrado. Confira o nome; só aparecem pessoas da organização no claude.ai.</p>';
}
document.addEventListener("focusin", (ev) => { if (ev.target.id === "busca") buscar(ev.target.value); });

async function exportarCSV() {
  const p = minhaPessoa(); const ts = tarefasPeriodo(lojasVisiveis(p));
  const lin = [["data", "loja", "setor", "tarefa", "status", "inicio_janela", "prazo", "executou", "enviada_em", "tentativas", "revisado_por", "motivo_reprovacao"]];
  for (const t of ts) { const x = tentativaAtual(t); lin.push([t.data, S.org.lojas[t.loja]?.nome, S.org.setores?.[t.setor], t.titulo, STATUS[statusVisivel(t)].l, hm(t.inicio), hm(t.prazo), x ? nomePessoa(x.por) : "", x?.envio ? dataHora(x.envio) : "", Object.keys(t.tentativas || {}).length, x?.revisao?.por ? nomePessoa(x.revisao.por) : "", x?.revisao?.motivo || ""]); }
  const csv = "﻿" + lin.map((l) => l.map((c) => { const s = String(c ?? ""); return /[";\n]/.test(s) || /^[=+\-@]/.test(s) ? `"${s.replace(/^([=+\-@])/, "'$1").replace(/"/g, '""')}"` : s; }).join(";")).join("\n");
  try { await S.dl.save({ filename: `ede-gestao-${hoje()}.csv`, data: new Blob([csv], { type: "text/csv" }) }); } catch { aviso("O arquivo não foi salvo.", "erro"); }
}
// Exemplos para a proprietária ver o painel funcionando (marcados e removíveis)
async function preencherExemplos() {
  const demo = Object.keys(S.pessoas).filter((id) => id.startsWith("demo-"));
  const gerentes = demo.filter((id) => S.pessoas[id].papel === "gerente");
  for (let d = 1; d <= 6; d++) {
    const data = somaDias(hoje(), -d);
    for (const loja of Object.keys(S.org.lojas)) {
      const atual = await S.db.doc(`dias/${loja}_${data}`).get();
      if (atual.exists && !atual.data()?.exemplo) continue; // nunca sobrescreve um dia real
      const ts = montarTarefas(loja, data); let i = 0;
      const colabs = demo.filter((id) => S.pessoas[id].papel === "colaborador" && S.pessoas[id].loja === loja);
      const ger = gerentes.find((id) => S.pessoas[id].loja === loja) || null;
      for (const t of Object.values(ts)) {
        i++; const sorte = (d * 7 + i * 13 + loja.length * 5) % 20; const por = colabs[(d + i) % Math.max(1, colabs.length)] || null;
        if (sorte === 0) { t.status = "cancelada"; t.cancelamento = { por: ger, em: t.inicio, motivo: "[EXEMPLO] Loja fechou mais cedo" }; continue; }
        if (sorte <= 2 || !por) continue; // não executada: atrasada
        const envio = new Date(new Date(t.prazo).getTime() - (sorte % 5) * 9 * 60000 + (sorte === 3 ? 40 * 60000 : 0)).toISOString();
        const resp = Object.fromEntries(Object.keys(t.itens).map((k) => [k, { ok: true, obs: "" }]));
        t.n = 1; t.tentativas = { 1: { por, inicio: t.inicio, envio, respostas: resp, fotos: {}, obs: "", exemplo: true } };
        if (!t.exigeAprovacao) { t.status = "aprovada"; t.tentativas[1].revisao = { decisao: "aprovada", auto: true, em: envio }; continue; }
        const revEm = new Date(new Date(envio).getTime() + (20 + sorte * 4) * 60000).toISOString();
        if (sorte === 4 || sorte === 9) {
          const item = Object.keys(t.itens)[sorte % Object.keys(t.itens).length];
          t.tentativas[1].revisao = { decisao: "reprovada", por: ger, em: revEm, motivo: "[EXEMPLO] Refazer o item marcado", itens: { [item]: true } };
          if (sorte === 4) { t.n = 2; t.status = "aprovada"; t.tentativas[2] = { por, inicio: revEm, envio: new Date(new Date(revEm).getTime() + 25 * 60000).toISOString(), respostas: resp, fotos: {}, obs: "", revisao: { decisao: "aprovada", por: ger, em: new Date(new Date(revEm).getTime() + 50 * 60000).toISOString() } }; }
          else t.status = "correcao";
        } else { t.status = "aprovada"; t.tentativas[1].revisao = { decisao: "aprovada", por: ger, em: revEm }; }
      }
      await S.db.doc(`dias/${loja}_${data}`).set({ loja, data, criadoEm: new Date().toISOString(), exemplo: true, tarefas: ts });
    }
  }
  aviso("Pronto: 6 dias de exemplo em cada loja. Use Apagar exemplos quando quiser.");
}
async function apagarExemplos() {
  const q = await S.db.collection("dias").where("exemplo", "==", true).get();
  for (const d of q.docs) await S.db.doc(`dias/${d.id}`).delete();
  S.painel.dias = null; aviso("Exemplos apagados.");
}

render();
iniciar().catch((e) => { console.error(e); S.erroGeral = "semdb"; render(); });
})();
