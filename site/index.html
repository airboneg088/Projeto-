<title>Éde Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de tarefas das lojas Éde — faixa laranja de fachada no topo, abas por papel, conteúdo em coluna única no celular. */
:root {
  --bg: #fff4e8; --surface: #ffffff; --surface-2: #f3e6d6; --line: #e3cfba;
  --ink: #2a1810; --ink-soft: #6b5a50; --brand: #ee5d06; --action: #c2470a; --action-ink: #ffffff;
  --focus: #2a1810; --danger: #a8291f; --ok: #1b5b2e;
  --s-pend-bg: #f7f0e8; --s-pend-fg: #4a3a30; --s-pend-bd: #b9a797;
  --s-and-bg: #e1ebf5; --s-and-fg: #1c4a78;
  --s-agu-bg: #fbedc4; --s-agu-fg: #664500;
  --s-apr-bg: #dfefe1; --s-apr-fg: #1b5b2e;
  --s-cor-bg: #e6c3e0; --s-cor-fg: #5a1f56;
  --s-atr-bg: #b3261e; --s-atr-fg: #ffffff;
  --s-can-bg: #f1ece7; --s-can-fg: #5c514a; --s-can-bd: #a39486;
  --font-display: "Bitter", Rockwell, Georgia, serif;
  --font-text: "Figtree", Arial, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --r-s: 6px; --r-m: 12px; --r-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a100b; --surface: #26180f; --surface-2: #33231a; --line: #4a3428; --ink: #fff4e8; --ink-soft: #d2bfb0;
  --brand: #ee5d06; --action: #e8692a; --action-ink: #1a0d06; --focus: #ffc9a6; --danger: #ff8f84; --ok: #8fd4a8;
  --s-pend-bg: #2b2019; --s-pend-fg: #ede1d6; --s-pend-bd: #6e5d51; --s-and-bg: #1b2d42; --s-and-fg: #bbd6f2;
  --s-agu-bg: #3b2d0c; --s-agu-fg: #f4d58e; --s-apr-bg: #163421; --s-apr-fg: #abddb6; --s-cor-bg: #5e2d59; --s-cor-fg: #fbe3f7;
  --s-atr-bg: #f2877d; --s-atr-fg: #2b0b07; --s-can-bg: #2a221d; --s-can-fg: #bfb2a7; --s-can-bd: #6e6158; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1a100b; --surface: #26180f; --surface-2: #33231a; --line: #4a3428; --ink: #fff4e8; --ink-soft: #d2bfb0;
  --brand: #ee5d06; --action: #e8692a; --action-ink: #1a0d06; --focus: #ffc9a6; --danger: #ff8f84; --ok: #8fd4a8;
  --s-pend-bg: #2b2019; --s-pend-fg: #ede1d6; --s-pend-bd: #6e5d51; --s-and-bg: #1b2d42; --s-and-fg: #bbd6f2;
  --s-agu-bg: #3b2d0c; --s-agu-fg: #f4d58e; --s-apr-bg: #163421; --s-apr-fg: #abddb6; --s-cor-bg: #5e2d59; --s-cor-fg: #fbe3f7;
  --s-atr-bg: #f2877d; --s-atr-fg: #2b0b07; --s-can-bg: #2a221d; --s-can-fg: #bfb2a7; --s-can-bd: #6e6158; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 16px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
select { max-width: 100%; min-width: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Fachada */
.top { background: var(--brand); color: #fff; }
.top .wrap { padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.top img { width: 132px; height: auto; display: block; }
.top .who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; min-width: 0; }
.top .who img.av { width: 30px; height: 30px; border-radius: 50%; }
.top .who .papel { font-weight: 500; opacity: .95; }
.top select { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: var(--r-s); padding: 6px 8px; min-height: 40px; max-width: 100%; }
.top select option { color: #2a1810; }
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 0 14px; min-height: 48px; font-weight: 600; color: var(--ink-soft); border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brand); }
.tab .badge { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border-radius: var(--r-pill); background: var(--action); color: var(--action-ink); font-size: 13px; text-align: center; }
main .wrap { padding-block: 20px 120px; display: grid; gap: 18px; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--r-m); border: 1px solid transparent; font-weight: 700; cursor: pointer; transition: transform 160ms var(--ease-out); text-decoration: none; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--action); color: var(--action-ink); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn.ghost { background: none; color: var(--ink); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
@media (hover: hover) and (pointer: fine) { .btn.primary:hover { filter: brightness(1.06); } .btn.secondary:hover { background: var(--surface-2); } .tab:hover { color: var(--ink); } }
@media (prefers-reduced-motion: reduce) { .btn, .check svg path { transition: none !important; } .btn:active { transform: none; } }

/* Contadores */
.cont { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.cont button { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px; text-align: left; cursor: pointer; min-height: 72px; display: grid; gap: 2px; }
.cont button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cont .n { font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: 1; }
.cont .l { font-size: 13px; font-weight: 600; color: var(--ink-soft); }

/* Status */
.st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.st svg { flex: none; }
.st.pendente { background: var(--s-pend-bg); color: var(--s-pend-fg); border-color: var(--s-pend-bd); }
.st.andamento { background: var(--s-and-bg); color: var(--s-and-fg); }
.st.enviada { background: var(--s-agu-bg); color: var(--s-agu-fg); }
.st.aprovada { background: var(--s-apr-bg); color: var(--s-apr-fg); }
.st.correcao { background: var(--s-cor-bg); color: var(--s-cor-fg); }
.st.atrasada { background: var(--s-atr-bg); color: var(--s-atr-fg); }
.st.cancelada { background: var(--s-can-bg); color: var(--s-can-fg); border-color: var(--s-can-bd); border-style: dashed; }

/* Listas de tarefas */
.grupo { display: grid; gap: 8px; }
.grupo > h3 { font-size: 15px; color: var(--ink-soft); font-weight: 700; }
.tarefa { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 6px; cursor: pointer; }
.tarefa .l1 { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.tarefa .tt { font-weight: 700; font-size: 17px; }
.tarefa .meta { font-size: 14px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.tarefa .aviso { font-size: 14px; color: var(--s-cor-fg); background: var(--s-cor-bg); padding: 6px 10px; border-radius: var(--r-s); }
.vazio { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 22px; display: grid; gap: 8px; text-align: center; justify-items: center; }
.vazio p { color: var(--ink-soft); max-width: 46ch; }
.nota { font-size: 14px; color: var(--ink-soft); }
.erro { color: var(--danger); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sep { height: 1px; background: var(--line); }
label.f { display: grid; gap: 6px; font-weight: 600; }
input[type="text"], input[type="time"], input[type="date"], input[type="number"], select.f, textarea { background: var(--surface); border: 1px solid var(--s-pend-bd); border-radius: var(--r-s); padding: 10px 12px; min-height: 48px; width: 100%; }
textarea { min-height: 88px; resize: vertical; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.chk input { width: 22px; height: 22px; accent-color: var(--action); }

/* Folha de execução */
#sheet, #modal { position: fixed; inset: 0; z-index: 20; }
#sheet[hidden], #modal[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(26,16,11,.55); }
.folha { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.folha .cab { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 2; padding-top: env(safe-area-inset-top, 0px); }
.folha .cab .wrap { display: flex; align-items: center; gap: 10px; min-height: 56px; }
.folha .cab h2 { font-size: 19px; flex: 1; min-width: 0; }
.folha .corpo { padding-block: 16px 140px; display: grid; gap: 16px; }
.barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 3; }
.barra .wrap { display: flex; gap: 10px; padding-block: 10px; }
.barra .btn { flex: 1; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; display: grid; gap: 10px; }
.item .top-i { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: start; }
.check { width: 44px; height: 44px; border-radius: var(--r-m); border: 2px solid var(--s-pend-bd); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: transform 140ms var(--ease-out); }
.check:active { transform: scale(0.95); }
.check[aria-checked="true"] { background: var(--s-apr-bg); border-color: var(--s-apr-fg); color: var(--s-apr-fg); }
.check[aria-checked="mixed"] { background: var(--s-cor-bg); border-color: var(--s-cor-fg); color: var(--s-cor-fg); }
.check svg path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 180ms var(--ease-out); }
.check[aria-checked="true"] svg path, .check[aria-checked="mixed"] svg path { stroke-dashoffset: 0; }
.item .tx { font-weight: 600; padding-top: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-soft); }
.tag.crit { background: var(--s-atr-bg); color: var(--s-atr-fg); }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; }
.fotos img { width: 96px; height: 96px; object-fit: cover; border-radius: var(--r-s); border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
.foto-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: var(--r-m); border: 1px dashed var(--action); color: var(--action); font-weight: 700; cursor: pointer; background: var(--surface); }
.foto-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.ref { width: 100%; max-height: 260px; object-fit: contain; background: var(--surface-2); border-radius: var(--r-m); }

/* Diálogo */
.dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--surface); border-radius: var(--r-m); padding: 20px; display: grid; gap: 14px; box-shadow: 0 18px 48px rgba(26,16,11,.35); animation: entra 200ms var(--ease-out); }
@keyframes entra { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .dlg { animation: none; } }
.zoom { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: var(--r-s); }
.zoom .fechar { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; }

/* Aprovação */
.env { display: grid; gap: 12px; }
.env .fotos img { width: 140px; height: 140px; }
.resp { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.resp li { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 8px; font-size: 15px; }
.resp .nc { color: var(--s-cor-fg); font-weight: 600; }
.alerta { background: var(--s-agu-bg); color: var(--s-agu-fg); border-radius: var(--r-s); padding: 8px 12px; font-size: 14px; font-weight: 600; }

/* Painel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.kpi { background: var(--surface-2); border-radius: var(--r-m); padding: 14px; display: grid; gap: 4px; }
.kpi .v { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; }
.kpi .k { font-weight: 600; font-size: 14px; }
.kpi .d { font-size: 13px; color: var(--ink-soft); }
.tabela { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 15px; }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; background: var(--surface-2); font-size: 13px; color: var(--ink-soft); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { tr.click:hover td { background: var(--surface-2); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 14px; min-height: 44px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.demo { background: var(--s-agu-bg); color: var(--s-agu-fg); }
.demo .wrap { padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; font-weight: 600; }
.demo select { flex: 1 1 220px; max-width: 460px; min-height: 40px; border-radius: var(--r-s); border: 1px solid currentColor; background: var(--surface); color: var(--ink); padding: 4px 8px; }
.carregando { display: grid; gap: 10px; }
.sk { height: 72px; border-radius: var(--r-m); background: var(--surface-2); }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 420px) { .cont { grid-template-columns: repeat(2, minmax(0,1fr)); } .top img { width: 112px; } }
</style>

<div id="root">
  <header class="top"><div class="wrap"><img src="img/ede-horizontal-branco.svg" alt="Éde Utilidades"><span style="font-family:var(--font-display);font-weight:800;font-size:20px">Gestão</span></div></header>
  <main><div class="wrap"><div class="carregando" aria-label="Carregando"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></main>
</div>
<div id="sheet" hidden></div>
<div id="modal" hidden></div>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------
const TZ = "America/Sao_Paulo";
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hoje = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
const somaDias = (iso, n) => { const d = new Date(iso + "T12:00:00-03:00"); d.setUTCDate(d.getUTCDate() + n); return new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d); };
const isoLocal = (data, hhmm) => new Date(`${data}T${hhmm}:00-03:00`).toISOString(); // São Paulo sem horário de verão desde 2019
const hm = (iso) => iso ? new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).format(new Date(iso)) : "";
const dataCurta = (iso) => new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit" }).format(new Date(iso));
const dataHora = (iso) => iso ? `${dataCurta(iso)} ${hm(iso)}` : "";
const diaSemana = (data) => { const w = new Date(data + "T12:00:00-03:00").getUTCDay(); return w === 0 ? 7 : w; };
const uid = (p) => p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const temTexto = (s) => /[0-9A-Za-zÀ-ÿ]/.test(String(s || ""));
const pct = (a, b) => b ? Math.round((a / b) * 1000) / 10 : null;
const fmtPct = (v) => v == null ? "—" : `${String(v).replace(".", ",")}%`;
const minDiff = (a, b) => Math.abs(new Date(a) - new Date(b)) / 60000;
const local = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

const ICON = {
  ok: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  relogio: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.8V8l2.2 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  play: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg>',
  ampulheta: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8M4 13.5h8M5 2.5c0 3 6 4 6 5.5S5 10.5 5 13.5M11 2.5c0 3-6 4-6 5.5s6 2.5 6 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  volta: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4L3 7l3 3M3.5 7H10a3 3 0 010 6H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  alerta: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 6.5v3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="11.8" r="1" fill="currentColor"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  camera: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5h3l1.5-2h5l1.5 2h3v9H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="10" cy="11" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
  check: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 11.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  nc: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M6 11h10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
  voltar: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 5l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const STATUS = {

      const loja = fd.get("loja"); const titulo = String(fd.get("titulo") || "").trim(); const ini = fd.get("inicio"), fim = fd.get("fim");
      const itens = String(fd.get("itens") || "").split("\n").map((s) => s.trim()).filter(Boolean);
      const erro = !temTexto(titulo) ? "Escreva o que precisa ser feito." : !ini || !fim ? "Preencha o horário de início e o prazo." : fim <= ini ? "O prazo precisa ser depois do início." : isoLocal(hoje(), fim) < new Date().toISOString() ? "O prazo já passou. Escolha um horário mais tarde." : !itens.length ? "Escreva ao menos um item do checklist." : null;
      if (erro) { $("#erroNova").textContent = erro; return; }
      const data = hoje(); const ref = S.db.doc(`dias/${loja}_${data}`); const snap = await ref.get();
      if (!snap.exists) await ref.set({ loja, data, criadoEm: new Date().toISOString(), tarefas: montarTarefas(loja, data) });
      const tid = uid("a_");
      await ref.update({ tarefas: { [tid]: { avulsa: true, criadaPor: p.id, titulo: titulo.slice(0, 120), instrucoes: String(fd.get("instrucoes") || "").slice(0, 1000), setor: fd.get("setor"), responsavel: fd.get("responsavel") || null,
        inicio: isoLocal(data, ini), prazo: isoLocal(data, fim), exigeFoto: fd.get("exigeFoto") === "on", exigeObs: false, exigeAprovacao: fd.get("exigeAprovacao") === "on", peso: 2,
        itens: Object.fromEntries(itens.slice(0, 20).map((tx, i) => [`i${i + 1}`, { texto: tx.slice(0, 200), ordem: i + 1, critico: false, foto: false, peso: 1 }])), status: "pendente", n: 0, tentativas: {} } } });
      f.reset(); S.tab = "dia"; render(); aviso("Tarefa criada. Ela já aparece para a equipe.");
    } else if (act === "salvarRotina") {
      const r = S.rotinas[S.modal.id]; const ini = fd.get("inicio"), fim = fd.get("fim"); const peso = Number(fd.get("peso"));
      if (!ini || !fim || fim <= ini) { $("#erroDlg").textContent = "O prazo precisa ser depois do início, no mesmo dia."; return; }
      if (!(peso >= 1 && peso <= 5)) { $("#erroDlg").textContent = "O peso vai de 1 a 5."; return; }
      const lojas = Object.fromEntries(Object.keys(S.org.lojas).map((k) => [k, fd.get("loja_" + k) === "on"]));
      await S.db.doc("config/rotinas").update({ rotinas: { [S.modal.id]: { inicio: ini, fim, peso, lojas, ativa: fd.get("ativa") === "on", versao: (r.versao || 1) + 1 } } });
      S.modal = null; renderModal(); aviso("Rotina salva. Vale a partir de amanhã.");
    } else if (act === "addPessoa") {
      const id = fd.get("id"); if (!id) { $("#erroPessoa").textContent = "Busque e escolha uma pessoa da organização."; return; }
      const papel = fd.get("papel"); const loja = fd.get("loja") || null;
      if ((papel === "colaborador" || papel === "gerente") && !loja) { $("#erroPessoa").textContent = "Colaborador e gerente precisam de uma loja."; return; }
      await S.db.doc("config/pessoas").update({ pessoas: { [id]: { papel, loja: papel === "proprietaria" || papel === "admin" ? null : loja, setor: papel === "colaborador" ? (fd.get("setor") || null) : null, ativo: true } } });
      f.reset(); $("#escolhido").textContent = "Ninguém escolhido."; aviso("Pessoa salva. Ela já pode abrir o site.");
    }
  } catch (e) { console.error(e); const el = $("#erroDlg") || $("#erroNova") || $("#erroPessoa"); const m = e?.code === "invalid_argument" ? "Você não tem permissão para esta mudança. Peça acesso de edição à proprietária." : "Não consegui salvar. Confira a conexão e tente de novo."; if (el) el.textContent = m; else aviso(m, "erro"); }
});
async function buscar(q) {
  const box = $("#resBusca"); if (!box || !S.user) return;
  const hits = await S.user.search(q || ""); S.perfis = { ...S.perfis, ...Object.fromEntries(hits.map((h) => [h.id, h])) };
  box.innerHTML = hits.map((h) => `<button type="button" class="btn secondary small" style="justify-content:flex-start" data-action="escolherPessoa" data-id="${esc(h.id)}" data-nome="${esc(h.name)}">${esc(h.name)}</button>`).join("") || '<p class="nota">Ninguém encontrado. Confira o nome; só aparecem pessoas da organização no claude.ai.</p>';
}
document.addEventListener("focusin", (ev) => { if (ev.target.id === "busca") buscar(ev.target.value); });

async function exportarCSV() {
  const p = minhaPessoa(); const ts = tarefasPeriodo(lojasVisiveis(p));
  const lin = [["data", "loja", "setor", "tarefa", "status", "inicio_janela", "prazo", "executou", "enviada_em", "tentativas", "revisado_por", "motivo_reprovacao"]];
  for (const t of ts) { const x = tentativaAtual(t); lin.push([t.data, S.org.lojas[t.loja]?.nome, S.org.setores?.[t.setor], t.titulo, STATUS[statusVisivel(t)].l, hm(t.inicio), hm(t.prazo), x ? nomePessoa(x.por) : "", x?.envio ? dataHora(x.envio) : "", Object.keys(t.tentativas || {}).length, x?.revisao?.por ? nomePessoa(x.revisao.por) : "", x?.revisao?.motivo || ""]); }
  const csv = "﻿" + lin.map((l) => l.map((c) => { const s = String(c ?? ""); return /[";\n]/.test(s) || /^[=+\-@]/.test(s) ? `"${s.replace(/^([=+\-@])/, "'$1").replace(/"/g, '""')}"` : s; }).join(";")).join("\n");
  try { await S.dl.save({ filename: `ede-gestao-${hoje()}.csv`, data: new Blob([csv], { type: "text/csv" }) }); } catch { aviso("O arquivo não foi salvo.", "erro"); }
}
// Exemplos para a proprietária ver o painel funcionando (marcados e removíveis)
async function preencherExemplos() {
  const demo = Object.keys(S.pessoas).filter((id) => id.startsWith("demo-"));
  const gerentes = demo.filter((id) => S.pessoas[id].papel === "gerente");
  for (let d = 1; d <= 6; d++) {
    const data = somaDias(hoje(), -d);
    for (const loja of Object.keys(S.org.lojas)) {
      const atual = await S.db.doc(`dias/${loja}_${data}`).get();
      if (atual.exists && !atual.data()?.exemplo) continue; // nunca sobrescreve um dia real
      const ts = montarTarefas(loja, data); let i = 0;
      const colabs = demo.filter((id) => S.pessoas[id].papel === "colaborador" && S.pessoas[id].loja === loja);
      const ger = gerentes.find((id) => S.pessoas[id].loja === loja) || null;
      for (const t of Object.values(ts)) {
        i++; const sorte = (d * 7 + i * 13 + loja.length * 5) % 20; const por = colabs[(d + i) % Math.max(1, colabs.length)] || null;
        if (sorte === 0) { t.status = "cancelada"; t.cancelamento = { por: ger, em: t.inicio, motivo: "[EXEMPLO] Loja fechou mais cedo" }; continue; }
        if (sorte <= 2 || !por) continue; // não executada: atrasada
        const envio = new Date(new Date(t.prazo).getTime() - (sorte % 5) * 9 * 60000 + (sorte === 3 ? 40 * 60000 : 0)).toISOString();
        const resp = Object.fromEntries(Object.keys(t.itens).map((k) => [k, { ok: true, obs: "" }]));
        t.n = 1; t.tentativas = { 1: { por, inicio: t.inicio, envio, respostas: resp, fotos: {}, obs: "", exemplo: true } };
        if (!t.exigeAprovacao) { t.status = "aprovada"; t.tentativas[1].revisao = { decisao: "aprovada", auto: true, em: envio }; continue; }
        const revEm = new Date(new Date(envio).getTime() + (20 + sorte * 4) * 60000).toISOString();
        if (sorte === 4 || sorte === 9) {
          const item = Object.keys(t.itens)[sorte % Object.keys(t.itens).length];
          t.tentativas[1].revisao = { decisao: "reprovada", por: ger, em: revEm, motivo: "[EXEMPLO] Refazer o item marcado", itens: { [item]: true } };
          if (sorte === 4) { t.n = 2; t.status = "aprovada"; t.tentativas[2] = { por, inicio: revEm, envio: new Date(new Date(revEm).getTime() + 25 * 60000).toISOString(), respostas: resp, fotos: {}, obs: "", revisao: { decisao: "aprovada", por: ger, em: new Date(new Date(revEm).getTime() + 50 * 60000).toISOString() } }; }
          else t.status = "correcao";
        } else { t.status = "aprovada"; t.tentativas[1].revisao = { decisao: "aprovada", por: ger, em: revEm }; }
      }
      await S.db.doc(`dias/${loja}_${data}`).set({ loja, data, criadoEm: new Date().toISOString(), exemplo: true, tarefas: ts });
    }
  }
  aviso("Pronto: 6 dias de exemplo em cada loja. Use Apagar exemplos quando quiser.");
}
async function apagarExemplos() {
  const q = await S.db.collection("dias").where("exemplo", "==", true).get();
  for (const d of q.docs) await S.db.doc(`dias/${d.id}`).delete();
  S.painel.dias = null; aviso("Exemplos apagados.");
}

render();
iniciar().catch((e) => { console.error(e); S.erroGeral = "semdb"; render(); });
})();
